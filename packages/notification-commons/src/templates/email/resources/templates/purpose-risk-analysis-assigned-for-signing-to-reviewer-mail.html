{{> common-header }}
<tr>
  <td align="left" class="title" style="font-size: 0px; padding: 24px 0px 8px; word-break: break-word">
    <div style="font-family: Titillium Web, system-ui, sans-serif; font-size: 13px; font-weight: bold; line-height: 1; text-align: left; color: #17324d">
      <h1 style="font-size: 32px; line-height: 40px; margin: 0">{{ title }}</h1>
    </div>
  </td>
</tr>
<tr>
  <td align="left" class="text" style="font-size: 0px; padding: 8px 0px 0px; word-break: break-word">
    <div style="font-family: Titillium Web, system-ui, sans-serif; font-size: 16px; font-weight: regular; line-height: 24px; text-align: left; color: #17324d">
      <p>
        L'ente {{ producerName }} ti ha assegnato un'analisi del rischio da
        approvare per la finalità {{ purposeTitle }} associata all'e-service
        {{ eserviceName }}. La trovi nella sezione Analisi del rischio.
      </p>
    </div>
  </td>
</tr>
{{> common-footer }}
