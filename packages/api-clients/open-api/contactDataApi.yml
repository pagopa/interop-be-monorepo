openapi: 3.0.3
info:
  title: Contact Data Manager
  description: Creates and retrieves contacts stored in the contact data database
  version: "{{version}}"
  contact:
    name: API Support
    url: http://www.example.com/support
    email: support@example.com
  termsOfService: "http://swagger.io/terms/"
  x-api-id: contact-data-manager
  x-summary: Creates and retrieves contacts
servers:
  - url: "/"
    description: This service is the contact data manager
security:
  - bearerAuth: []
tags:
  - name: contact
    description: Creates and retrieves contacts
  - name: health
    description: Verify service status
paths:
  /contacts:
    post:
      tags:
        - contact
      summary: Create a contact
      description: >-
        Creates a contact with a new opaque ID generated by the CDM.
        Each successful request creates a distinct contact, even when another
        contact has the same email address. Email addresses are not unique.
      operationId: createContact
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        description: The email address to store
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSeed"
      responses:
        "201":
          description: The created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid request body, email address or correlation ID header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /contacts/{contactId}:
    get:
      tags:
        - contact
      summary: Retrieve a contact
      description: >-
        Returns the contact identified by its opaque ID.
        An ID that is not a valid UUID results in 400; a valid UUID that does not
        identify an existing contact results in 404.
      operationId: getContact
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - in: path
          name: contactId
          description: Opaque identifier of the contact
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid contact ID format or correlation ID header
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No contact exists for the supplied valid contact ID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /status:
    get:
      security: []
      tags:
        - health
      summary: Health status endpoint
      description: Return ok
      operationId: getStatus
      responses:
        "200":
          description: successful operation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    CorrelationIdHeader:
      in: header
      name: X-Correlation-Id
      required: true
      schema:
        type: string
  schemas:
    ContactSeed:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Email address of the contact
      required:
        - email
    Contact:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Opaque UUID generated by the CDM, independent of the email address
        email:
          type: string
          format: email
          description: Email address of the contact
      required:
        - id
        - email
    Problem:
      description: An error response that must not include email addresses in its details
      properties:
        type:
          description: URI reference of type definition
          type: string
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 503
          exclusiveMaximum: true
          format: int32
          maximum: 600
          minimum: 100
          type: integer
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          maxLength: 64
          pattern: "^[ -~]{0,64}$"
          type: string
        correlationId:
          description: Unique identifier of the request
          example: "53af4f2d-0c87-41ef-a645-b726a821852b"
          maxLength: 64
          type: string
        detail:
          description: A human readable explanation of the problem, without email addresses.
          example: Request took too long to complete.
          maxLength: 4096
          pattern: "^.{0,1024}$"
          type: string
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProblemError"
      additionalProperties: false
      required:
        - type
        - status
        - title
    ProblemError:
      properties:
        code:
          description: Internal code of the error
          example: 018-0001
          minLength: 8
          maxLength: 8
          pattern: "^[0-9]{3}-[0-9]{4}$"
          type: string
        detail:
          description: A human readable explanation specific to this occurrence of the problem, without email addresses.
          example: Parameter not valid
          maxLength: 4096
          pattern: "^.{0,1024}$"
          type: string
      required:
        - code
        - detail
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  securitySchemes:
    bearerAuth:
      type: http
      description: A bearer token in the format of a JWS and conforming to the specifications included in [RFC8725](https://tools.ietf.org/html/RFC8725).
      scheme: bearer
      bearerFormat: JWT
