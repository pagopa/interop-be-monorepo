name: PR OpenAPI additive check
on:
  pull_request:
    # "edited" reruns the check when the PR description changes
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openapi-additive-check:
    name: Check BFF OpenAPI additive changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch PR base commit
        env:
          OPENAPI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$OPENAPI_BASE_SHA"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          run_install: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ./package.json
      - name: Check additive BFF OpenAPI changes
        run: pnpm --filter pagopa-interop-api-clients check:openapi-additive
        env:
          OPENAPI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OPENAPI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENAPI_PR_DESCRIPTION: ${{ github.event.pull_request.body }}
