name: PR conflict check

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request_target:
    types: [synchronize, ready_for_review]

concurrency:
  group: conflict-check-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  conflict-check:
    name: Check for merge conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const startedAt = Date.now();
            const log = (message, details = {}) => {
              console.log(JSON.stringify({
                message,
                elapsedMs: Date.now() - startedAt,
                ...details,
              }));
            };

            let prsToCheck = [];
            log('Starting conflict check', {
              event: context.eventName,
              ref: context.ref,
            });

            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (!pr.draft) {
                prsToCheck.push(pr);
              }
              log('Collected pull request from event', {
                pullRequest: pr.number,
                draft: pr.draft,
              });
            } else {
              const pushedBranch = context.ref.replace('refs/heads/', '');
              let page = 1;
              while (true) {
                const { data } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  base: pushedBranch,
                  per_page: 100,
                  page,
                });
                prsToCheck.push(...data.filter(pr => !pr.draft));
                log('Listed pull requests', {
                  base: pushedBranch,
                  page,
                  returned: data.length,
                  nonDraft: data.filter(pr => !pr.draft).length,
                });
                if (data.length < 100) break;
                page++;
              }
            }

            log('Collected pull requests to check', {
              count: prsToCheck.length,
            });

            for (const pr of prsToCheck) {
              log('Checking pull request', { pullRequest: pr.number });
              // Query immediately, then back off while GitHub computes mergeability.
              const retryDelaysMs = [1000, 2000, 4000, 8000, 15000];
              let detail;
              for (let attempt = 0; attempt < 6; attempt++) {
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                });
                detail = data;
                log('Received mergeability status', {
                  pullRequest: pr.number,
                  attempt: attempt + 1,
                  mergeableState: detail.mergeable_state,
                });
                if (detail.mergeable_state !== 'unknown') break;

                const retryDelayMs = retryDelaysMs[attempt];
                if (retryDelayMs !== undefined) {
                  log('Mergeability is unknown; waiting before retry', {
                    pullRequest: pr.number,
                    retryDelayMs,
                  });
                  await new Promise(resolve => setTimeout(resolve, retryDelayMs));
                }
              }

              // Skip if GitHub still hasn't determined mergeability
              if (detail.mergeable_state === 'unknown') {
                log('Skipping pull request because mergeability is still unknown', {
                  pullRequest: pr.number,
                });
                continue;
              }

              const marker = '<!-- conflict-bot -->';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
              });
              const existing = comments.find(c => c.body.includes(marker));
              log('Loaded pull request comments', {
                pullRequest: pr.number,
                commentCount: comments.length,
                hasConflictComment: Boolean(existing),
                mergeableState: detail.mergeable_state,
              });

              if (detail.mergeable_state === 'dirty') {
                if (!existing) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pr.number,
                    body: `${marker}\n⚠️ @${pr.user.login} This PR now has merge conflicts with \`${detail.base.ref}\`. Please merge the target branch to resolve them.`,
                  });
                  log('Created conflict comment', { pullRequest: pr.number });
                }
              } else if (existing) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                });
                log('Deleted resolved conflict comment', { pullRequest: pr.number });
              }
            }

            log('Completed conflict check', { checked: prsToCheck.length });
